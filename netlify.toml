# Netlify — https://cipi.sh
# `/` is the English homepage (200). Edge i18n lives in netlify/edge-functions/i18n.js
# Do not language-redirect `/` — Google will not index a homepage that 302s.

[build]
  publish = "."
  # No build step — static site

[[edge_functions]]
  function = "i18n"
  path = "/*"

[[redirects]]
  from = "https://www.cipi.sh/*"
  to = "https://cipi.sh/:splat"
  status = 301
  force = true
