<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cipi</title>
  <!-- Soft fallback while edge redirect runs; never index this stub -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://cipi.sh/en/">
  <link rel="alternate" hreflang="en" href="https://cipi.sh/en/">
  <link rel="alternate" hreflang="it" href="https://cipi.sh/it/">
  <link rel="alternate" hreflang="x-default" href="https://cipi.sh/en/">
  <meta http-equiv="refresh" content="0;url=/en/">
  <script>
    (function () {
      var cookie = document.cookie.match(/(?:^|;\s*)cipi-lang=(en|it)(?=;|$)/);
      var lang = 'en';
      if (cookie) {
        lang = cookie[1];
      } else {
        var tags = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || 'en'];
        for (var i = 0; i < tags.length; i++) {
          var t = String(tags[i] || '').toLowerCase();
          if (t === 'it' || t.indexOf('it-') === 0) { lang = 'it'; break; }
        }
      }
      location.replace('/' + lang + '/');
    })();
  </script>
  <style>
    body { font-family: ui-monospace, monospace; margin: 2rem; color: #1a1a1a; }
    a { color: inherit; }
  </style>
</head>
<body>
  <p><a href="/en/">English</a> / <a href="/it/">Italiano</a></p>
</body>
</html>
